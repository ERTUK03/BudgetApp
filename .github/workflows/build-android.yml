name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install MAUI Android workload
        run: |
          dotnet workload install maui-android
          dotnet workload update

      - name: Pin Android SDK version
        run: |
          dotnet add mobile/BudgetApp/BudgetApp.csproj package Microsoft.Android.Sdk.Linux --version 34.99.0 --no-restore || true

      - name: Restore packages
        run: dotnet restore mobile/BudgetApp/BudgetApp.csproj

      - name: Build APK
        run: >-
          dotnet build mobile/BudgetApp/BudgetApp.csproj
          -f net9.0-android
          -c Debug
          -p:AndroidKeyStore=false
          -p:AndroidSdkDirectory=$ANDROID_SDK_ROOT
          -p:AndroidEnableAssemblyCompression=false
          -p:_ApkPerAbi=false
          -t:PackageForAndroid

      - name: Find APK
        run: find mobile/BudgetApp -name "*.apk" -o -name "*.aab"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BudgetApp-APK
          path: |
            mobile/BudgetApp/**/*.apk
            mobile/BudgetApp/**/*.aab
          if-no-files-found: warns