name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android --version 9.0.100 --skip-sign-check

      - name: Restore packages
        run: dotnet restore mobile/BudgetApp/BudgetApp.csproj -p:TargetFramework=net9.0-android

      - name: Build and package APK
        run: |
          dotnet build mobile/BudgetApp/BudgetApp.csproj `
            -f net9.0-android `
            -c Debug `
            -p:AndroidKeyStore=false `
            -p:AndroidSdkDirectory=$env:ANDROID_HOME `
            -t:SignAndroidPackage

      - name: Find APK
        run: Get-ChildItem -Recurse -Filter "*.apk" mobile/BudgetApp/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BudgetApp-APK
          path: |
            mobile/BudgetApp/**/*.apk
          if-no-files-found: warn