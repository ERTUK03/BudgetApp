name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install MAUI Android workload
        run: |
          dotnet workload install maui-android --from-rollback-file https://aka.ms/dotnet/9.0.1xx/daily/roslyn-compiler.json --skip-sign-check || dotnet workload install maui-android

      - name: Restore packages
        run: dotnet restore mobile/BudgetApp/BudgetApp.csproj

      - name: Build APK
        run: >-
          dotnet build mobile/BudgetApp/BudgetApp.csproj
          -f net9.0-android
          -c Debug
          -p:AndroidKeyStore=false
          -p:AndroidSdkDirectory=$ANDROID_SDK_ROOT
          -p:AndroidEnableAssemblyCompression=false
          -t:PackageForAndroid

      - name: Find APK
        run: find mobile/BudgetApp -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BudgetApp-APK
          path: mobile/BudgetApp/**/*.apk
          if-no-files-found: warn