name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install MAUI workload
        run: dotnet workload install maui-android

      - name: Restore packages
        run: dotnet restore mobile/BudgetApp/BudgetApp.csproj

      - name: Build APK
        run: dotnet publish mobile/BudgetApp/BudgetApp.csproj -f net9.0-android -c Release -p:AndroidSdkDirectory=$env:ANDROID_HOME -p:AndroidKeyStore=false

      - name: Find APK
        run: Get-ChildItem -Recurse -Filter "*.apk" mobile/BudgetApp/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BudgetApp-APK
          path: mobile/BudgetApp/bin/Release/net9.0-android/publish/*.apk
          if-no-files-found: warn
